server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users/**

        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/events/**,/admin/events/**,/users/*/events/**,/categories/**,/admin/categories/**,/compilations/**,/admin/compilations/**

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/*/requests/**

        - id: comment-service
          uri: lb://comment-service
          predicates:
            - Path=/comments/**,/admin/comments/**,/users/*/comments/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/users
    username: user
    password: password

  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/